<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="ระบบขอรายงานโรงพยาบาลบุรีรัมย์ — ศูนย์คอมพิวเตอร์" />
  <title>ระบบขอรายงานโรงพยาบาลบุรีรัมย์ — เข้าสู่ระบบ</title>
  <link rel="stylesheet" href="login.css?v=2.8" />
</head>
<body>

<div class="login-page">
  <div class="login-card" id="login-card">
    <!-- Logo -->
    <div class="login-logo">
      <div class="logo-icon">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M8 2h8v6h6v8h-6v6H8v-6H2V8h6z"/>
        </svg>
      </div>
      <h1 style="font-size: 21px; line-height: 1.35;">ระบบขอรายงาน<br><span>โรงพยาบาลบุรีรัมย์</span></h1>
      <p class="login-subtitle">ศูนย์คอมพิวเตอร์ โรงพยาบาลบุรีรัมย์</p>
    </div>

    <!-- Form -->
    <form id="login-form" autocomplete="off">
      <div class="form-group">
        <label for="username">ชื่อผู้ใช้</label>
        <div class="input-icon-wrap">
          <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
          </svg>
          <input type="text" id="username" name="username" placeholder="กรอก username PM" required autofocus />
        </div>
      </div>

      <div class="form-group">
        <label for="password">รหัสผ่าน</label>
        <div class="input-icon-wrap">
          <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
          <input type="password" id="password" name="password" placeholder="กรอกรหัสผ่าน PM" required />
        </div>
      </div>

      <!-- Error message -->
      <div class="error-message" id="error-message" style="display: none;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/>
        </svg>
        <span id="error-text"></span>
      </div>

      <button type="submit" class="login-btn" id="login-btn">
        <span class="btn-text">เข้าสู่ระบบ</span>
        <div class="btn-spinner" style="display:none;"></div>
      </button>
    </form>

    <div class="login-footer">
      <p>ระบบขอรายงานและสื่อสารภายใน โรงพยาบาลบุรีรัมย์</p>
    </div>
  </div>
</div>

<script src="login.js"></script>
</body>
</html>
